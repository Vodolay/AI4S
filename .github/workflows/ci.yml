name: ci

on:
  push:
  pull_request:

# A push to a branch with an open PR triggers two runs of the same commit, and a
# second push starts a third while the first two are still going. On a private
# repository sharing two vCPUs, that is what makes the smoke run miss its
# timeout. Supersede rather than pile up; never cancel a run on the default
# branch, where the result is the record of whether the tree is good.
concurrency:
  # The event belongs in the key. Without it the push and pull_request runs of
  # the same commit shared a group and one cancelled the other - a cancelled
  # check blocks a merge, which is worse than the pile-up this is meant to
  # prevent. With it, the only thing superseded is an earlier push to the same
  # branch, which is the intent.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Lint and unit tests are split from the smoke run because they fail for
  # unrelated reasons and, run together, shared a single budget: a 25-minute
  # inner bound on the smoke run inside a 30-minute job left five minutes for
  # everything else, so the job died whenever the runner was slow rather than
  # whenever the code was wrong. Split, they also run in parallel.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch to avoid multi-GB CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        # One command, the same one a developer runs. When CI checked
        # `ruff check` and `make lint` also checked `ruff format`, formatting
        # drifted for months in files nobody linted by hand - and the first
        # thing to fail CI on it was a generated file. If the two can differ,
        # eventually they will.
        run: make lint
      - name: Unit tests
        run: pytest -m "not network"

  smoke:
    # `run_all.py --quick` end to end. Its own job, so a slow runner costs it
    # time rather than costing the unit tests their result.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch to avoid multi-GB CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      # Restore and save are split so that only a *successful* run writes the
      # cache. A run whose fetch was refused by a host leaves a partial
      # data/raw behind, and caching that tree made every later run start from
      # missing files and fail in the data stage - a broken run teaching the
      # next one to be broken.
      - name: Restore raw downloads
        id: raw_downloads
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/neuromps/fetch/**') }}
      - name: Smoke run (quick)
        # The project's promise is ten minutes on a CPU, and it holds on the
        # development machine: 401 s over 16 cores. A private repository gets
        # two shared vCPUs, and a contended runner has taken more than twice
        # that. The bound is sized to the machine, not to the promise, and its
        # job is to catch a stage that has stopped terminating rather than one
        # that is merely slow. It sits well inside the job timeout so that a
        # slow run reports *which* stage overran instead of the job dying
        # first.
        run: timeout 2100 python run_all.py --quick
      - name: Save raw downloads
        if: success() && steps.raw_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/neuromps/fetch/**') }}
      - name: The quick run must not have touched the full run's outputs
        # --quick writes to outputs/quick/ and data/processed/quick/. If this
        # step ever fails, some writer resolved its path at import time instead
        # of through neuromps.paths.
        run: |
          git status --porcelain
          git diff --exit-code

  report:
    # The PDF is a deliverable, so its build is checked on every push rather
    # than discovered to be broken at submission time. The page range is a
    # requirement of the submission, not a style preference - which is why it is
    # checked on the PDF that is submitted. That is the Word build: LibreOffice's
    # rendering of report/TECHNICAL_REPORT.docx. This job used to gate the LaTeX
    # build instead, a denser-margined document nobody submits, and once the
    # report gained its model diagrams the two disagreed by four pages.
    runs-on: ubuntu-latest
    # LibreOffice is ~150 MB of packages. The runner's Ubuntu mirror usually
    # serves that in a minute or two, but on 2026-10-09 it took eight minutes
    # for one 20 MB package and the job was cancelled at 20 before rendering a
    # page. The budget is for the download, not the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install LibreOffice, Carlito and poppler
        # The same LibreOffice (24.2) and the same Carlito package as the machine
        # the report is proofed on, so CI paginates what the author paginates.
        # Carlito is metric-compatible with Calibri, the font the Word design
        # names; without it LibreOffice substitutes a wider face and every table
        # reflows. DejaVu covers the monospace fallback for code spans.
        run: |
          # Skip rebuilding the man-page index after install, which nothing here reads.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            libreoffice-writer-nogui fonts-crosextra-carlito fonts-dejavu-core \
            fontconfig poppler-utils
          soffice --version
      - name: Install the renderer's one dependency
        # Not `pip install -e .`, which would pull torch into a job that exists to
        # render a document. The pin must match pyproject.toml; a test checks it.
        run: python -m pip install python-docx==1.2.0
      # The same check the citation apparatus runs locally. A number that drifted
      # from the metrics is a broken deliverable whether or not the PDF renders,
      # and finding that out at submission time is too late.
      - name: Every cited number matches the metrics
        run: PYTHONPATH=src python3 -m neuromps.report.verify
      - name: Build the technical report and check its length
        run: report/build_docx.sh --check-pages 15
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: technical-report
          path: |
            report/TECHNICAL_REPORT.pdf
            report/TECHNICAL_REPORT.docx
          if-no-files-found: error
