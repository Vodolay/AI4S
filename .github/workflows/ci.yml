name: ci

on:
  push:
  pull_request:

# A push to a branch with an open PR triggers two runs of the same commit, and a
# second push starts a third while the first two are still going. On a private
# repository sharing two vCPUs, that is what makes the smoke run miss its
# timeout. Supersede rather than pile up; never cancel a run on the default
# branch, where the result is the record of whether the tree is good.
concurrency:
  # The event belongs in the key. Without it the push and pull_request runs of
  # the same commit shared a group and one cancelled the other - a cancelled
  # check blocks a merge, which is worse than the pile-up this is meant to
  # prevent. With it, the only thing superseded is an earlier push to the same
  # branch, which is the intent.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch to avoid multi-GB CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      # One command, the same one a developer runs. When CI checked `ruff check`
      # and `make lint` also checked `ruff format`, formatting drifted for months
      # in files nobody linted by hand - and the first thing to fail CI on it was
      # a generated file. If the two can differ, eventually they will.
      - name: Lint
        run: make lint
      - name: Unit tests
        run: pytest -m "not network"
      # Restore and save are split so that only a *successful* run writes the
      # cache. A run whose fetch was refused by a host leaves a partial
      # data/raw behind, and caching that tree made every later run start from
      # missing files and fail in the data stage - a broken run teaching the
      # next one to be broken.
      - name: Restore raw downloads
        id: raw_downloads
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/neuromps/fetch/**') }}
      - name: Smoke run (quick)
        # The project's promise is that --quick finishes inside ten minutes on
        # a CPU, and it does on the development machine: 401 s. This runner is
        # not that machine. A private repository gets **two** shared vCPUs, so
        # `worker_processes` correctly asks for 2 where the development machine
        # uses 16, and the twin stage - four serial Brian2 runs plus the draws -
        # takes most of the budget on its own. Measured here: fetch 105 s, data
        # 113 s, models 42 s before the twin starts.
        #
        # So the bound is sized to the machine rather than to the promise. It
        # is still a bound, and its job is to catch a stage that has stopped
        # terminating rather than one that is merely slow. The honest number
        # for a reader is in the report: 401 s here, about 800 s there.
        run: timeout 1500 python run_all.py --quick
      - name: Save raw downloads
        if: success() && steps.raw_downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/neuromps/fetch/**') }}
      - name: The quick run must not have touched the full run's outputs
        # --quick writes to outputs/quick/ and data/processed/quick/. If this
        # step ever fails, some writer resolved its path at import time instead
        # of through neuromps.paths.
        run: |
          git status --porcelain
          git diff --exit-code

  report:
    # The PDF is a deliverable, so its build is checked on every push rather
    # than discovered to be broken at submission time. The page range is a
    # requirement of the submission, not a style preference.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pandoc, xelatex and poppler
        env:
          # Pinned, not apt's pandoc. pandoc carries the LaTeX template, so a
          # different version is a different document: Ubuntu's older pandoc
          # loaded neither the font packages nor caption, and its line breaking
          # could differ enough to move the page count past the limit checked
          # below. This is the version the report is written and proofed
          # against, so CI renders what the author renders.
          PANDOC_VERSION: "3.11"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            texlive-latex-extra lmodern fonts-dejavu-core fontconfig poppler-utils
          # texlive-latex-extra carries unicode-math, footnotehyper and xurl, which
          # pandoc's xelatex template loads; fontconfig provides fc-list, without
          # which the build cannot find a font with Greek and arrows.
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSL -O "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${deb}"
          sudo dpkg -i "${deb}"
          pandoc --version | head -1
      # The same check the citation apparatus runs locally. A number that drifted
      # from the metrics is a broken deliverable whether or not the PDF renders,
      # and finding that out at submission time is too late.
      - name: Every cited number matches the metrics
        # Run from the source tree rather than installing: the verifier needs
        # only the standard library, and `pip install -e .` would pull torch
        # into a job that exists to render a PDF.
        run: PYTHONPATH=src python3 -m neuromps.report.verify
      - name: Build the technical report
        run: report/build_report.sh --check-pages 15 20
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: technical-report
          path: report/TECHNICAL_REPORT.pdf
          if-no-files-found: error
