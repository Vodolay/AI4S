name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch to avoid multi-GB CUDA wheels)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -m "not network"
      - name: Cache raw downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('src/neuromps/fetch/**') }}
      - name: Smoke run (quick)
        run: timeout 600 python run_all.py --quick
